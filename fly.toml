# fly.toml app configuration file generated for vietquiz on 2026-05-24T14:40:38+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vietquiz'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  APP_DEBUG = 'false'
  APP_ENV = 'production'
  APP_FAKER_LOCALE = 'vi_VN'
  APP_FALLBACK_LOCALE = 'vi'
  APP_LOCALE = 'vi'
  APP_NAME = 'VietQuiz'
  AUTO_DB_SEED = 'true'
  AUTO_DB_SEED_FORCE = 'false'
  BROADCAST_CONNECTION = 'log'
  CACHE_STORE = 'database'
  FILESYSTEM_DISK = 'local'
  LOG_CHANNEL = 'stderr'
  LOG_LEVEL = 'info'
  QUEUE_CONNECTION = 'database'
  RUN_STARTUP_TASKS = 'true'
  SESSION_DRIVER = 'database'
  VITE_APP_NAME = 'VietQuiz'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '60s'
    method = 'GET'
    path = '/'

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024


