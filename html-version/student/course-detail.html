<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chi tiết Khóa học — VietQuiz</title>
  <link rel="stylesheet" href="../css/design-system.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <style>
    .course-header { background:linear-gradient(135deg,var(--course-color,#3b82f6),color-mix(in srgb,var(--course-color,#3b82f6) 60%,#000)); padding:2rem 1.5rem 3.5rem; color:#fff; }
    .course-progress-ring { position:relative; width:6rem; height:6rem; }
    .course-progress-ring svg { transform:rotate(-90deg); }
    .course-progress-ring .pct { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:var(--text-lg); font-weight:700; }
  </style>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-slot"></div>
  <div class="main-container">
    <div id="header-slot"></div>
    <main class="main-content" style="padding:0;">

      <!-- Course hero -->
      <div class="course-header" id="course-header">
        <div style="max-width:900px;margin:0 auto;">
          <!-- Breadcrumb -->
          <div style="margin-bottom:1rem;">
            <a href="courses.html" style="color:rgba(255,255,255,.7);font-size:var(--text-sm);text-decoration:none;display:inline-flex;align-items:center;gap:0.25rem;">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              Khóa học
            </a>
          </div>
          <div style="display:flex;align-items:flex-start;gap:1.5rem;flex-wrap:wrap;">
            <div>
              <h1 style="color:#fff;font-size:var(--text-3xl);margin-bottom:0.5rem;" id="course-title">Toán 10 — Học kỳ II</h1>
              <p style="color:rgba(255,255,255,.8);font-size:var(--text-sm);" id="course-teacher">GV: Nguyễn Văn A • Lớp 10A</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Content -->
      <div style="max-width:900px;margin:0 auto;padding:0 1.5rem 2rem;">

        <!-- Stats + progress -->
        <div style="display:grid;grid-template-columns:1fr auto;gap:1.5rem;align-items:center;margin-top:-2rem;margin-bottom:1.5rem;">
          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:0.75rem;">
            <div class="stat-card" style="text-align:center;">
              <div class="stat-card__value" id="stat-quizzes">8</div>
              <div class="stat-card__label">Bài kiểm tra</div>
            </div>
            <div class="stat-card" style="text-align:center;">
              <div class="stat-card__value" id="stat-assignments">12</div>
              <div class="stat-card__label">Bài tập</div>
            </div>
            <div class="stat-card" style="text-align:center;">
              <div class="stat-card__value" id="stat-completed">6</div>
              <div class="stat-card__label">Đã hoàn thành</div>
            </div>
            <div class="stat-card" style="text-align:center;">
              <div class="stat-card__value" style="color:var(--success);" id="stat-avg">78%</div>
              <div class="stat-card__label">Điểm TB</div>
            </div>
          </div>
          <div style="text-align:center;flex-shrink:0;">
            <div class="course-progress-ring" id="progress-ring">
              <svg width="96" height="96" viewBox="0 0 96 96">
                <circle cx="48" cy="48" r="40" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="8"/>
                <circle cx="48" cy="48" r="40" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"
                  stroke-dasharray="251.2" stroke-dashoffset="87.92" id="progress-circle"/>
              </svg>
              <div class="pct" style="color:#fff;" id="progress-pct">65%</div>
            </div>
            <div style="font-size:var(--text-xs);color:rgba(255,255,255,.7);margin-top:0.25rem;">Hoàn thành</div>
          </div>
        </div>

        <!-- Nav tabs -->
        <div class="nav-tabs" style="margin-bottom:1.5rem;">
          <button class="nav-tab active" onclick="switchTab('content',this)">Nội dung</button>
          <button class="nav-tab" onclick="switchTab('quizzes',this)">Bài kiểm tra</button>
          <button class="nav-tab" onclick="switchTab('assignments',this)">Bài tập</button>
          <button class="nav-tab" onclick="switchTab('grades',this)">Điểm số</button>
        </div>

        <!-- Tab: Nội dung -->
        <div id="tab-content">
          <div id="syllabus-list"></div>
        </div>

        <!-- Tab: Bài kiểm tra -->
        <div id="tab-quizzes" style="display:none;">
          <div class="card" id="quiz-list"></div>
        </div>

        <!-- Tab: Bài tập -->
        <div id="tab-assignments" style="display:none;">
          <div class="card" id="assignment-list"></div>
        </div>

        <!-- Tab: Điểm số -->
        <div id="tab-grades" style="display:none;">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;">
            <div class="card">
              <div class="card-header"><h3 class="card-title">Điểm theo Bài kiểm tra</h3></div>
              <div class="card-content" id="quiz-grades"></div>
            </div>
            <div class="card">
              <div class="card-header"><h3 class="card-title">Điểm theo Bài tập</h3></div>
              <div class="card-content" id="assignment-grades"></div>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>
</div>
<div id="toast-container"></div>
<script type="module">
  import { initDashboardPage } from '../js/components/page-init.js';
  import { toastSuccess } from '../js/components/toast.js';
  initDashboardPage('student');

  const COURSE_COLOR = '#3b82f6';
  document.getElementById('course-header').style.setProperty('--course-color', COURSE_COLOR);

  // Syllabus
  const SYLLABUS = [
    { title:'Chương 1: Hàm số bậc hai', status:'completed', lessons:4 },
    { title:'Chương 2: Phương trình bậc hai', status:'completed', lessons:5 },
    { title:'Chương 3: Bất phương trình', status:'in_progress', lessons:6 },
    { title:'Chương 4: Hệ phương trình', status:'pending', lessons:5 },
    { title:'Chương 5: Thống kê xác suất', status:'pending', lessons:4 },
  ];
  const statusLabel = { completed:'Đã hoàn thành', in_progress:'Đang học', pending:'Chưa bắt đầu' };
  const statusColor = { completed:'var(--success)', in_progress:'var(--warning)', pending:'var(--muted-foreground)' };
  document.getElementById('syllabus-list').innerHTML = SYLLABUS.map(ch => `
    <div class="card" style="margin-bottom:0.75rem;">
      <div class="card-content" style="padding:1rem;display:flex;align-items:center;gap:1rem;">
        <div style="width:2.5rem;height:2.5rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:var(--text-sm);flex-shrink:0;
          background:${ch.status === 'completed' ? 'color-mix(in srgb,var(--success) 15%,transparent)' : ch.status === 'in_progress' ? 'color-mix(in srgb,var(--warning) 15%,transparent)' : 'var(--muted)'};
          color:${statusColor[ch.status]};">
          ${ch.status === 'completed' ? '✓' : ch.lessons}
        </div>
        <div style="flex:1;">
          <div style="font-weight:500;font-size:var(--text-sm);">${ch.title}</div>
          <div style="font-size:var(--text-xs);color:var(--muted-foreground);">${ch.lessons} bài học</div>
        </div>
        <div>
          <span class="badge" style="color:${statusColor[ch.status]};background:${ch.status === 'completed' ? 'color-mix(in srgb,var(--success) 12%,transparent)' : ch.status === 'in_progress' ? 'color-mix(in srgb,var(--warning) 12%,transparent)' : 'var(--muted)'};">
            ${ch.status === 'completed' ? '✓ ' : ''}${statusLabel[ch.status]}
          </span>
        </div>
      </div>
    </div>
  `).join('');

  // Quizzes
  const QUIZZES = [
    { id:1, title:'Kiểm tra Chương 1', date:'15/01/2026', duration:45, questions:20, score:88, status:'graded', badge:'badge-success' },
    { id:2, title:'Kiểm tra Chương 2', date:'05/02/2026', duration:45, questions:20, score:82, status:'graded', badge:'badge-success' },
    { id:3, title:'Giữa kỳ', date:'01/03/2026', duration:90, questions:40, score:null, status:'upcoming', badge:'badge-warning' },
    { id:4, title:'Kiểm tra Chương 3', date:'15/03/2026', duration:45, questions:20, score:null, status:'pending', badge:'badge-default' },
  ];
  document.getElementById('quiz-list').innerHTML = QUIZZES.length ? QUIZZES.map(q => `
    <div class="card-content" style="padding:1rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;">
      <div style="flex:1;">
        <div style="font-weight:500;font-size:var(--text-sm);">${q.title}</div>
        <div style="font-size:var(--text-xs);color:var(--muted-foreground);">${q.questions} câu • ${q.duration} phút • ${q.date}</div>
      </div>
      ${q.score !== null ? `
        <div style="text-align:center;">
          <div style="font-size:var(--text-2xl);font-weight:700;color:${q.score >= 80 ? 'var(--success)' : q.score >= 60 ? 'var(--warning)' : 'var(--destructive)'};">${q.score}</div>
          <div style="font-size:var(--text-xs);color:var(--muted-foreground);">/100</div>
        </div>
        <a href="quiz-result.html?id=${q.id}" class="btn btn-ghost btn-sm">Xem kết quả</a>
      ` : q.status === 'upcoming' ? `
        <span class="badge badge-warning">Sắp tới</span>
        <a href="quiz-take.html?id=${q.id}" class="btn btn-primary btn-sm">Làm bài</a>
      ` : `
        <span class="badge badge-default">Chưa mở</span>
      `}
    </div>
    <hr class="separator" />
  `).join('') : '<div class="empty-state"><p>Chưa có bài kiểm tra nào.</p></div>';

  // Assignments
  const ASSIGNMENTS = [
    { id:1, title:'Bài tập Hàm số bậc hai', date:'20/01/2026', due:'27/01/2026', score:9.5, max:10 },
    { id:2, title:'Bài tập Phương trình', date:'10/02/2026', due:'17/02/2026', score:8.0, max:10 },
    { id:3, title:'Bài tập Bất phương trình', date:'01/03/2026', due:'08/03/2026', score:null, max:10 },
  ];
  document.getElementById('assignment-list').innerHTML = ASSIGNMENTS.length ? ASSIGNMENTS.map(a => `
    <div class="card-content" style="padding:1rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;">
      <div style="flex:1;">
        <div style="font-weight:500;font-size:var(--text-sm);">${a.title}</div>
        <div style="font-size:var(--text-xs);color:var(--muted-foreground);">Giao: ${a.date} • Hạn: ${a.due}</div>
      </div>
      ${a.score !== null ? `
        <div style="text-align:center;">
          <div style="font-size:var(--text-2xl);font-weight:700;color:${a.score >= 8 ? 'var(--success)' : a.score >= 6 ? 'var(--warning)' : 'var(--destructive)'};">${a.score}</div>
          <div style="font-size:var(--text-xs);color:var(--muted-foreground);">/${a.max}</div>
        </div>
        <a href="grades.html" class="btn btn-ghost btn-sm">Chi tiết</a>
      ` : `
        <span class="badge badge-warning">Chưa nộp</span>
        <a href="assignments.html" class="btn btn-primary btn-sm">Nộp bài</a>
      `}
    </div>
    <hr class="separator" />
  `).join('') : '<div class="empty-state"><p>Chưa có bài tập nào.</p></div>';

  // Grades tabs
  document.getElementById('quiz-grades').innerHTML = QUIZZES.filter(q => q.score !== null).map(q => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:0.625rem 0;border-bottom:1px solid var(--border);">
      <span style="font-size:var(--text-sm);">${q.title}</span>
      <span style="font-weight:600;font-size:var(--text-sm);color:${q.score >= 80 ? 'var(--success)' : q.score >= 60 ? 'var(--warning)' : 'var(--destructive)'};">${q.score}/100</span>
    </div>
  `).join('');
  document.getElementById('assignment-grades').innerHTML = ASSIGNMENTS.filter(a => a.score !== null).map(a => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:0.625rem 0;border-bottom:1px solid var(--border);">
      <span style="font-size:var(--text-sm);">${a.title}</span>
      <span style="font-weight:600;font-size:var(--text-sm);color:${a.score >= 8 ? 'var(--success)' : a.score >= 6 ? 'var(--warning)' : 'var(--destructive)'};">${a.score}/${a.max}</span>
    </div>
  `).join('');

  // Tab switching
  window.switchTab = (tab, btn) => {
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    ['content','quizzes','assignments','grades'].forEach(t => {
      document.getElementById('tab-' + t).style.display = t === tab ? '' : 'none';
    });
  };
</script>
<script>
