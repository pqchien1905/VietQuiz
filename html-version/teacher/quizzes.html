<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bài kiểm tra — VietQuiz (Giáo viên)</title>
  <link rel="stylesheet" href="../css/design-system.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <style>
    .quiz-title-cell { display:flex; align-items:center; gap:.75rem; }
    .quiz-icon {
      width:2.25rem; height:2.25rem; border-radius:var(--radius-md);
      display:flex; align-items:center; justify-content:center;
      font-size:1rem; flex-shrink:0;
    }
    .submit-bar { display:flex; align-items:center; gap:.5rem; }
    .submit-bar .progress { width:4rem; height:.375rem; }
    .tab-bar { display:flex; gap:0; border-bottom:1px solid var(--border); margin-bottom:1.25rem; }
    .tab-btn {
      padding:.625rem 1.25rem; font-size:var(--text-sm); font-weight:500;
      background:none; border:none; border-bottom:2px solid transparent;
      color:var(--muted-foreground); cursor:pointer; transition:all var(--transition-fast);
      display:flex; align-items:center; gap:.375rem;
    }
    .tab-btn:hover { color:var(--foreground); }
    .tab-btn.active { color:var(--primary); border-bottom-color:var(--primary); }
    .tab-count {
      font-size:var(--text-xs); background:var(--muted); color:var(--muted-foreground);
      padding:.1rem .5rem; border-radius:var(--radius-full); font-weight:600;
    }
    .tab-btn.active .tab-count { background:var(--primary); color:var(--primary-foreground); }
  </style>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-slot"></div>
  <div class="main-container">
    <div id="header-slot"></div>
    <main class="main-content">

      <!-- Page Header -->
      <div class="page-header stagger-children">
        <div class="flex items-center justify-between flex-wrap gap-4">
          <div>
            <h1>Bài kiểm tra &amp; Kỳ thi</h1>
            <p style="color:var(--muted-foreground);margin-top:0.25rem;">Tạo, quản lý và phân tích bài kiểm tra và kỳ thi của bạn</p>
          </div>
          <a href="quiz-create.html" class="btn btn-primary gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Tạo Kỳ thi Mới
          </a>
        </div>
      </div>

      <!-- Stats -->
      <div class="stats-grid stats-grid-4 stagger-children" style="margin-bottom:1.5rem;">
        <div class="stat-card">
          <div style="font-size:var(--text-sm);color:var(--muted-foreground);margin-bottom:0.5rem;">Tổng số Kỳ thi</div>
          <div class="stat-card__value" id="stat-total">12</div>
        </div>
        <div class="stat-card">
          <div style="font-size:var(--text-sm);color:var(--muted-foreground);margin-bottom:0.5rem;">Đang hoạt động</div>
          <div class="stat-card__value" style="color:var(--success);" id="stat-active">5</div>
        </div>
        <div class="stat-card">
          <div style="font-size:var(--text-sm);color:var(--muted-foreground);margin-bottom:0.5rem;">Nháp</div>
          <div class="stat-card__value" style="color:var(--warning);" id="stat-draft">3</div>
        </div>
        <div class="stat-card">
          <div style="font-size:var(--text-sm);color:var(--muted-foreground);margin-bottom:0.5rem;">Đã đóng</div>
          <div class="stat-card__value" style="color:var(--muted-foreground);" id="stat-closed">4</div>
        </div>
      </div>

      <!-- Tabs & Toolbar -->
      <div class="tab-bar stagger-children" id="tab-bar">
        <button class="tab-btn active" data-tab="all">Tất cả <span class="tab-count" id="tc-all">12</span></button>
        <button class="tab-btn" data-tab="active">Đang hoạt động <span class="tab-count" id="tc-active">5</span></button>
        <button class="tab-btn" data-tab="draft">Nháp <span class="tab-count" id="tc-draft">3</span></button>
        <button class="tab-btn" data-tab="closed">Đã đóng <span class="tab-count" id="tc-closed">4</span></button>
      </div>

      <div class="toolbar stagger-children">
        <div class="toolbar-left">
          <div class="search-input-wrapper" style="max-width:340px; flex:1;">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="search-icon"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="search" class="input" placeholder="Tìm kiếm kỳ thi..." id="search-input" oninput="applyFilters()" style="font-size:var(--text-sm);" />
          </div>
          <select class="input select" id="filter-class" onchange="applyFilters()" style="max-width:160px;font-size:var(--text-sm);">
            <option value="">Tất cả lớp</option>
            <option>Lớp 10A</option><option>Lớp 11B</option><option>Lớp 9C</option><option>Lớp 10B</option><option>Lớp 12A</option>
          </select>
          <select class="input select" id="sort-by" onchange="applyFilters()" style="max-width:170px;font-size:var(--text-sm);">
            <option value="due">Sắp xếp: Hạn nộp</option>
            <option value="title">Sắp xếp: Tên</option>
            <option value="avg">Sắp xếp: Điểm TB</option>
            <option value="submitted">Sắp xếp: Bài nộp</option>
          </select>
        </div>
        <div class="toolbar-right">
          <span id="result-count" style="font-size:var(--text-sm);color:var(--muted-foreground);white-space:nowrap;"></span>
          <button class="btn btn-outline btn-sm gap-2" onclick="exportCSV()">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Xuất CSV
          </button>
        </div>
      </div>

      <!-- Quizzes Table -->
      <div class="card stagger-children" style="margin-top:1rem;">
        <div class="table-wrapper" style="border:none;border-radius:0;">
          <table>
            <thead>
              <tr>
                <th>Tên Bài thi</th>
                <th>Lớp</th>
                <th>Câu hỏi</th>
                <th>Thời gian</th>
                <th>Hạn nộp</th>
                <th>Bài nộp</th>
                <th>Điểm TB</th>
                <th>Trạng thái</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="quizzes-table"></tbody>
          </table>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal-overlay" id="delete-modal">
  <div class="modal" style="max-width:26rem;">
    <div class="modal-body" style="text-align:center;padding:2rem;">
      <div style="font-size:3rem;margin-bottom:.75rem;">🗑️</div>
      <h3 style="font-size:var(--text-xl);font-weight:700;margin-bottom:.5rem;">Xóa kỳ thi?</h3>
      <p style="color:var(--muted-foreground);font-size:var(--text-sm);margin-bottom:1.5rem;" id="delete-msg">Kỳ thi sẽ được chuyển vào thùng rác.</p>
      <div style="display:flex;gap:.75rem;justify-content:center;">
        <button class="btn btn-outline" onclick="closeDeleteModal()">Hủy</button>
        <button class="btn btn-destructive" id="delete-confirm-btn">Xóa</button>
      </div>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script>
(function () {
  var QUIZZES = [
    { id:1,  title:'Kiểm tra Cuối kì Toán',           cls:'Lớp 10A', questions:25, duration:60, due:'15/04/2026', submitted:28, total:32, avg:76.4, status:'active',  color:'#3b82f6' },
    { id:2,  title:'Đánh giá Giữa kì Vật lý',         cls:'Lớp 11B', questions:30, duration:45, due:'10/04/2026', submitted:25, total:28, avg:82.1, status:'active',  color:'#f97316' },
    { id:3,  title:'Kiểm tra Hóa học — Bảng Tuần hoàn',cls:'Lớp 9C',  questions:20, duration:30, due:'05/04/2026', submitted:30, total:30, avg:71.5, status:'closed',  color:'#22c55e' },
    { id:4,  title:'Thực hành Thí nghiệm Sinh học',    cls:'Lớp 10B', questions:15, duration:90, due:'20/04/2026', submitted:0,  total:35, avg:null, status:'draft',   color:'#a855f7' },
    { id:5,  title:'Kiểm tra Văn — Truyện Kiều',       cls:'Lớp 11B', questions:40, duration:60, due:'18/04/2026', submitted:10, total:28, avg:68.0, status:'active',  color:'#ef4444' },
    { id:6,  title:'Kiểm tra Anh văn Ngữ pháp',        cls:'Lớp 10A', questions:50, duration:45, due:'25/04/2026', submitted:0,  total:32, avg:null, status:'draft',   color:'#06b6d4' },
    { id:7,  title:'Kiểm tra 15p Toán Đại số',         cls:'Lớp 10A', questions:10, duration:15, due:'02/04/2026', submitted:32, total:32, avg:85.2, status:'closed',  color:'#3b82f6' },
    { id:8,  title:'Kiểm tra Lịch sử Việt Nam',        cls:'Lớp 12A', questions:35, duration:45, due:'12/04/2026', submitted:29, total:30, avg:74.8, status:'active',  color:'#eab308' },
    { id:9,  title:'Thi Thử THPT Toán',                cls:'Lớp 12A', questions:50, duration:90, due:'01/04/2026', submitted:30, total:30, avg:62.3, status:'closed',  color:'#3b82f6' },
    { id:10, title:'Kiểm tra Địa lý — Khí hậu',       cls:'Lớp 9C',  questions:20, duration:30, due:'22/04/2026', submitted:15, total:30, avg:79.1, status:'active',  color:'#06b6d4' },
    { id:11, title:'Kiểm tra Tin học cơ bản',          cls:'Lớp 10B', questions:30, duration:40, due:'28/04/2026', submitted:0,  total:35, avg:null, status:'draft',   color:'#ec4899' },
    { id:12, title:'Kiểm tra 1 tiết Vật lý — Quang',  cls:'Lớp 11B', questions:25, duration:45, due:'03/04/2026', submitted:28, total:28, avg:73.6, status:'closed',  color:'#f97316' },
  ];

  var STATUS_MAP = {
    active: { badge:'badge-success', label:'Đang hoạt động' },
    draft:  { badge:'badge-warning', label:'Nháp' },
    closed: { badge:'badge-info',    label:'Đã đóng' }
  };

  var currentTab = 'all';
  var deleteTargetId = null;

  /* ---- Tab switching ---- */
  document.getElementById('tab-bar').addEventListener('click', function(e) {
    var btn = e.target.closest('.tab-btn');
    if (!btn) return;
    document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    currentTab = btn.getAttribute('data-tab');
    applyFilters();
  });

  /* ---- Render ---- */
  function renderTable(data) {
    var tbody = document.getElementById('quizzes-table');
    document.getElementById('result-count').textContent = data.length + ' kỳ thi';

    if (!data.length) {
      tbody.innerHTML = '<tr><td colspan="9"><div style="padding:3rem;text-align:center;color:var(--muted-foreground);">'
        + '<div style="font-size:3rem;margin-bottom:.75rem;">📝</div>'
        + '<h3 style="font-size:var(--text-xl);font-weight:600;margin-bottom:.375rem;color:var(--foreground);">Không tìm thấy kỳ thi</h3>'
        + '<p>Thử thay đổi bộ lọc hoặc tạo kỳ thi mới</p>'
        + '<a href="quiz-create.html" class="btn btn-primary btn-sm" style="margin-top:1rem;">Tạo Kỳ thi Đầu tiên</a>'
        + '</div></td></tr>';
      return;
    }

    tbody.innerHTML = data.map(function(q) {
      var pct = q.total ? Math.round((q.submitted / q.total) * 100) : 0;
      var avgColor = q.avg >= 70 ? 'var(--success)' : q.avg ? 'var(--warning)' : 'var(--muted-foreground)';
      var st = STATUS_MAP[q.status];

      return '<tr>'
        + '<td><div class="quiz-title-cell">'
        +   '<div class="quiz-icon" style="background:' + q.color + '22;color:' + q.color + ';">'
        +     '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>'
        +   '</div>'
        +   '<div><div style="font-weight:600;">' + q.title + '</div></div>'
        + '</div></td>'
        + '<td><span class="badge badge-default">' + q.cls + '</span></td>'
        + '<td>' + q.questions + ' câu</td>'
        + '<td>' + q.duration + ' phút</td>'
        + '<td style="font-size:var(--text-sm);">' + q.due + '</td>'
        + '<td><div class="submit-bar">'
        +   '<div class="progress"><div class="progress-bar" style="width:' + pct + '%;background:' + (pct >= 80 ? 'var(--success)' : pct > 0 ? 'var(--info)' : 'var(--muted)') + ';"></div></div>'
        +   '<span style="font-size:var(--text-sm);white-space:nowrap;">' + q.submitted + '/' + q.total + '</span>'
        + '</div></td>'
        + '<td><span style="font-weight:600;color:' + avgColor + ';">' + (q.avg ? q.avg.toFixed(1) + '%' : '—') + '</span></td>'
        + '<td><span class="badge ' + st.badge + '">' + st.label + '</span></td>'
        + '<td><div style="display:flex;gap:0.25rem;">'
        +   '<a href="quiz-detail.html?id=' + q.id + '" class="btn btn-ghost btn-sm">Kết quả</a>'
        +   '<a href="quiz-create.html?edit=' + q.id + '" class="btn btn-ghost btn-sm">Sửa</a>'
        +   '<button class="btn btn-ghost btn-sm" style="color:var(--destructive);" onclick="openDeleteModal(' + q.id + ')">Xóa</button>'
        + '</div></td>'
        + '</tr>';
    }).join('');
  }

  /* ---- Filter & Sort ---- */
  window.applyFilters = function() {
    var search = (document.getElementById('search-input').value || '').toLowerCase();
    var cls = document.getElementById('filter-class').value;
    var sortBy = document.getElementById('sort-by').value;

    var list = QUIZZES.filter(function(q) {
      var matchSearch = !search || q.title.toLowerCase().indexOf(search) !== -1 || q.cls.toLowerCase().indexOf(search) !== -1;
      var matchTab = currentTab === 'all' || q.status === currentTab;
      var matchCls = !cls || q.cls === cls;
      return matchSearch && matchTab && matchCls;
    });

    list.sort(function(a, b) {
      if (sortBy === 'title') return a.title.localeCompare(b.title, 'vi');
      if (sortBy === 'avg') return (b.avg || 0) - (a.avg || 0);
      if (sortBy === 'submitted') return b.submitted - a.submitted;
      // default: due date
      var da = a.due.split('/').reverse().join('');
      var db = b.due.split('/').reverse().join('');
      return da.localeCompare(db);
    });

    renderTable(list);
  };

  /* ---- Delete modal ---- */
  window.openDeleteModal = function(id) {
    deleteTargetId = id;
    var q = QUIZZES.find(function(x){ return x.id === id; });
    if (q) document.getElementById('delete-msg').textContent = 'Kỳ thi "' + q.title + '" sẽ được chuyển vào thùng rác.';
    document.getElementById('delete-modal').classList.add('open');
    document.getElementById('delete-confirm-btn').onclick = function() { confirmDelete(); };
  };
  window.closeDeleteModal = function() { document.getElementById('delete-modal').classList.remove('open'); deleteTargetId = null; };

  function confirmDelete() {
    if (!deleteTargetId) return;
    var q = QUIZZES.find(function(x){ return x.id === deleteTargetId; });
    QUIZZES = QUIZZES.filter(function(x){ return x.id !== deleteTargetId; });
    closeDeleteModal();
    updateStats();
    applyFilters();
    if (q) showToast('Đã xóa kỳ thi "' + q.title + '"', 'success');
  }

  window.exportCSV = function() { showToast('Đã xuất file CSV thành công!', 'success'); };

  /* ---- Stats ---- */
  function updateStats() {
    var total = QUIZZES.length;
    var active = QUIZZES.filter(function(q){ return q.status === 'active'; }).length;
    var draft = QUIZZES.filter(function(q){ return q.status === 'draft'; }).length;
    var closed = QUIZZES.filter(function(q){ return q.status === 'closed'; }).length;
    document.getElementById('stat-total').textContent = total;
    document.getElementById('stat-active').textContent = active;
    document.getElementById('stat-draft').textContent = draft;
    document.getElementById('stat-closed').textContent = closed;
    document.getElementById('tc-all').textContent = total;
    document.getElementById('tc-active').textContent = active;
    document.getElementById('tc-draft').textContent = draft;
    document.getElementById('tc-closed').textContent = closed;
  }

  /* ---- Toast ---- */
  function showToast(msg, type) {
    var tc = document.getElementById('toast-container'); if (!tc) return;
    var t = document.createElement('div');
    t.className = 'toast toast-' + (type || 'success');
    t.innerHTML = '<span>' + (type === 'success' ? '✅' : 'ℹ️') + '</span><span>' + msg + '</span>';
    tc.appendChild(t);
    setTimeout(function(){ t.classList.add('show'); }, 10);
    setTimeout(function(){ t.classList.remove('show'); setTimeout(function(){ t.remove(); }, 300); }, 3000);
  }

  /* Close modal on overlay */
  document.getElementById('delete-modal').addEventListener('click', function(e){ if (e.target === this) closeDeleteModal(); });

  /* Init */
  updateStats();
  applyFilters();
})();
</script>

  var un = cn ? decodeURIComponent(cn[1]) : 'Giáo viên Demo';
  var initials = un.split(' ').filter(Boolean).map(function(w){return w[0];}).slice(-2).join('').toUpperCase();

  var saved = localStorage.getItem('vietquiz-theme') || 'system';
  var dark  = saved === 'dark' || (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  if (dark) document.documentElement.classList.add('dark');

  var navHTML = NAV.map(function(n){
    var a = page === n.h;
    return '<a href="' + n.h + '" class="nav-item' + (a?' active':'') + '">' + I[n.i] + '<span>' + n.k + '</span></a>';
  }).join('');

  var ss = document.getElementById('sidebar-slot');
  if (ss) {
    ss.outerHTML = '<aside class="sidebar" id="main-sidebar">'
      + '<a href="../index.html" class="sidebar-logo"><div class="sidebar-logo-icon">' + I.grad + '</div>'

      + '<nav class="sidebar-nav">' + navHTML + '</nav>'
      + '<div class="sidebar-bottom">'
      +   ''
      +   '<a href="trash.html" class="nav-item' + (page==='trash.html'?' active':'') + '">' + I.trash + '<span>Thùng rác</span></a>'
      +   ''
      + '</div></aside>'
      + '<div class="mobile-overlay" id="mobile-overlay"></div>';

      document.getElementById('main-sidebar').classList.remove('mobile-open');
      ov.classList.remove('open');

      +     '</button>'
      +     '<div class="dropdown-menu" id="umenu">'
      +       '<div class="dropdown-label">Tài khoản</div>'
      +       '<a href="vip.html" class="dropdown-item" style="color:#eab308;">' + I.crown + ' Nâng VIP</a>'
      +       '<div class="dropdown-separator"></div>'
      +       '<a href="profile.html" class="dropdown-item">' + I.user + ' Hồ sơ</a>'
      +       '<a href="settings.html" class="dropdown-item">' + I.cog + ' Cài đặt</a>'
      +       '<a href="help.html" class="dropdown-item"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> Hỗ trợ</a>'
      +       '<div class="dropdown-separator"></div>'
      +       '<button class="dropdown-item danger" id="hlbtn">' + I.out + ' Đăng xuất</button>'
      +     '</div>'
      +   '</div>'
      + '</div></header>';

    document.getElementById('mobmenubtn').onclick = function(){
      document.getElementById('main-sidebar').classList.toggle('mobile-open');
      document.getElementById('mobile-overlay').classList.toggle('open');
    };
    document.getElementById('hlbtn').onclick = function(){
      document.cookie='auth_role=;path=/;expires=Thu,01 Jan 1970 00:00:00 GMT';
      document.cookie='auth_name=;path=/;expires=Thu,01 Jan 1970 00:00:00 GMT';
      location.href='../login.html';
    };
    document.getElementById('ttbtn').onclick = function(){
      var d = document.documentElement.classList.toggle('dark');
      localStorage.setItem('vietquiz-theme', d ? 'dark' : 'light');
      document.getElementById('ttbtn').innerHTML = d ? I.sun : I.moon;
    };
    var ut = document.getElementById('umtrigger');
    var um = document.getElementById('umenu');
    if (ut && um) {
      ut.onclick = function(e){ e.stopPropagation(); um.classList.toggle('open'); };
      document.addEventListener('click', function(){ um.classList.remove('open'); });
    }
  }

  document.body.classList.add('page-enter');
})();
</script>
